#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "answer"
name = "Answer"
description.en = "Knowledge-based community software"
description.fr = "Logiciel communautaire de partage de connaissances"

version = "2.0.1~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://answer.apache.org/"
admindoc = "https://answer.apache.org/docs"
code = "https://github.com/apache/answer"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["fr", "en"]
    default = "fr"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Use the help field to add an information for the admin about this question."
    help.fr = "Utilisez le champ aide pour ajouter une information à l'intention de l'administrateur à propos de cette question."
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/apache/answer/releases/download/v2.0.1/apache-answer-2.0.1-bin-linux-amd64.tar.gz"
    amd64.sha256 = "71a6c1662b82c1369853506fe27ef78dcd4f0b5c98055ef400ef60fb99343ecb"
    arm64.url = "https://github.com/apache/answer/releases/download/v2.0.1/apache-answer-2.0.1-bin-linux-arm64.tar.gz"
    arm64.sha256 = "30e2d4cadb195e69b9596013ee00408d5ef0c43ec609523ac185fbdb0a462c78"
    
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "cache", "conf", "i18n" ]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
